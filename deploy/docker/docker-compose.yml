# Run the reviews fetcher as one always-on container. Nothing else on the host.
#   cp .env.example .env   &&   edit .env   &&   cp config.example.json config.json (edit it)
#   docker compose up -d --build
services:
  google-reviews:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: renacode/google-reviews:latest
    container_name: google-reviews
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.json:/app/config.json:ro   # your PRIVATE config (real CID, name)
      - reviews-data:/data                   # persists last-good reviews.json
volumes:
  reviews-data:
